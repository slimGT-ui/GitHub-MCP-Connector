name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Inspect dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const audit = require('./npm-audit.json'); console.log(JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2)); for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) console.log(JSON.stringify({ name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable, via: item.via.map((entry) => typeof entry === 'string' ? entry : entry.title) }));"
